<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performans ve OKR</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
<script src="employee.js" defer></script>
<script src="manager.js" defer></script>
<script src="hr.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".35"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".7"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/><path d="M16 16 L27 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div><strong>Performans</strong><span>KPI karnesi · OKR · geri bildirim</span></div>
  </div>
  <nav class="persona" role="tablist" aria-label="Persona">
    <button role="tab" data-persona="employee">Çalışan</button>
    <button role="tab" data-persona="manager">Yönetici</button>
    <button role="tab" data-persona="hr">İK Yöneticisi</button>
  </nav>
  <label class="whoami">
    <span>Kim olarak bakıyorum</span>
    <select id="who" aria-label="Kim olarak bakıyorum"></select>
  </label>
</header>
<nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
<main id="main" tabindex="-1">
  <div class="loading"><span class="spinner"></span><span>Workiom verisi yükleniyor…</span></div>
</main>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header><h2 id="drawer-title"></h2><button class="icon-btn" id="drawer-close" aria-label="Kapat">✕</button></header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer class="drawer-foot" id="drawer-foot"></footer>
  </div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
