<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portföy · Ar-Ge Proje Merkezi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"></header>
<main>
  <div class="page-head">
    <div>
      <h1>Proje Portföyü</h1>
      <p>Tüm Ar-Ge projelerinin ilerlemesi, gecikmeleri ve kritik kilometre taşları.</p>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-refresh" type="button">↻ Yenile</button>
      <button class="btn" id="btn-csv" type="button">⤓ Excel</button>
      <button class="btn primary" id="btn-new" type="button">＋ Yeni Proje</button>
    </div>
  </div>
  <section class="kpis" id="kpis" aria-label="Özet göstergeler"></section>
  <section id="projects" aria-label="Projeler"></section>
  <section class="card port" id="summary" aria-label="Proje özeti"></section>
  <section class="card port" aria-labelledby="port-t">
    <div class="page-head" style="margin-bottom:6px">
      <h2 id="port-t">Çoklu proje zaman çizelgesi</h2>
      <div class="toolbar">
        <div class="seg" id="zoom" role="group" aria-label="Ölçek">
          <button type="button" data-z="ay" aria-pressed="false">Ay</button>
          <button type="button" data-z="ceyrek" aria-pressed="true">Çeyrek</button>
          <button type="button" data-z="yil" aria-pressed="false">Yıl</button>
        </div>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:var(--summary)"></i>Proje / faz</span>
      <span>◆ Kilometre taşı</span>
      <span><i style="background:var(--critical);height:2px"></i>Kritik yol</span>
      <span><i style="background:var(--critical);width:2px;height:12px"></i>Bugün</span>
    </div>
    <div class="gantt-wrap" id="port-gantt" style="max-height:520px;min-height:200px"></div>
  </section>
</main>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="gantt.js"></script>
<script src="portfoy.js"></script>
</body>
</html>
